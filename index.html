<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Main Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class = 'lang-toggle' id="langToggle"></div>
    <div class ="emergency-banner" id="emergencyBanner"></div>
    <header class="hero">
        <div class="wrap hero-intro">
            <p class="eyebrow" id="eybrow"></p>
            <h1 class="title" id="title"></h1>
            <p class="hero-sub" id="heroSub"></p>
            <p class="hero-byline" id="heroByline"></p>
        </div>
        <nav class= "signpost" aria-label="Jump to a care setting"></nav>
    </header>
    <div class = " directory">
        <div class = " wrap directory-inner">
            <label class="search-box">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor"/><line x1="11" y1="11" x2="15" y2="15" stroke="currentColor"/></svg>
                <input type="text" id="'searchInput" aria-label="'Search situations">
            </label>
            <div id="chipRow" role="group" aria-label="Filter by care setting "style="display:flex; flex-wrap:wrap; gap:8px;"></div>
            <span class="result-count" id="resultCount"></span>
        </div>
    </div>

    <main class="wrap">
        <section id="guide">
            <div class="section-head">
                <span class="section-num">01</span>
                <h2 class="section-title" id="section1Title"></h2>
            </div>
            <p class="section-note" id="section1Note"></p>
            <div class ='grid' id="cardGrid"></div>
            <p class="empty-state" id="emptyState" hidden></p>
        </section>
    </main>

    <section class="story-section" id="story">
        <div class="wrap">
            <div class="section-head">
                <span class="section-num">03</span>
                <h2 class="section-title" id="section3Title"></h2>
            </div>
            <p class="story-intro" id="storyIntro"></p>
            <div class="timeline" id="storyTimeline"></div>
        </div>
    </section>

    <footer class="wrap">
        <p id="footerText"></p>
    </footer>
    <script src="data.js"></script>
    <script stc="script.js"></script>
</body>
</html>
