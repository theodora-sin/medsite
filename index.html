<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MedSite</title>
<meta name="description"content="A patient's guide to UK healthcare, built from personal experience. Find out where to go for your situation \u2014 from self-care to A&E \u2014 what to ask for, and what to expect.">
<meta property="og:title" content="Which place shall I visit \u2014 a UK healthcare navigation guide">
<meta property="og:description" content="Six routes into NHS care, ranked from 'wait it out' to 'call 999'. Find where to go, what to ask for, and what to expect.">
<meta property="og:type" content="website">
<link rel="icon" type="favicon.webp" href="favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>
<div class="emergency-banner" id="emergencyBanner"></div>

<header class="hero">
  <div class="wrap hero-intro">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 class="title" id="title"></h1>
    <p class="hero-sub" id="heroSub"></p>
    <p class="hero-byline" id="heroByline"></p>
  </div>
</header>

<nav class="tabbar">
  <div class="wrap tabbar-inner">
    <div class="tabs" id="tabButtons" role="tablist">
      <span class="tab-indicator" id="tabIndicator"></span>
    </div>
    <div class="tabbar-right">
      <div class="zoom-toggle" id="zoomToggle"></div>
      <div class="lang-toggle" id="langToggle"></div>
    </div>
  </div>
</nav>

<main class="wrap">
  <section id="guide" role="tabpanel">
    <p class="chip-hint" id="chipHint"></p>
    <p class="location-note" id="locationNote"></p>
    <div class="directory">
      <label class="search-box">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor"/><line x1="11" y1="11" x2="15" y2="15" stroke="currentColor"/></svg>
        <input type="text" id="searchInput" aria-label="Search situations">
      </label>
      <div id="chipRow" role="group" aria-label="Filter by care setting"></div>
      <span class="result-count" id="resultCount"></span>
    </div>

    <p class="section-note" id="section1Note"></p>
    <div class="grid" id="cardGrid"></div>
    <p class="empty-state" id="emptyState" hidden></p>
  </section>

  <section id="support" role="tabpanel" hidden>
    <p class="section-note" id="section2Note"></p>
    <div class="support-grid" id="supportGrid"></div>
  </section>

  <section class="story-section wrap" id="story" role="tabpanel" hidden>
    <p class="story-intro" id="storyIntro"></p>
    <div class="timeline" id="storyTimeline"></div>
  </section>
</main>

<footer class="wrap">
  <p id="footerText"></p>
  <p class="legal-link"><a href="legal.html" id="legalLink"></a></p>
</footer>

<button class="scroll-top" id="scrollTop" aria-label="Scroll to top" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 15l6-6 6 6"/></svg>
</button>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
