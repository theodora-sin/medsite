<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Main</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class ="emergency-banner" id="emergencyBanner"></div>
    
    <header class="hero">
        <div class="wrap hero-intro">
            
            <p class="eyebrow" id="eyebrow"></p>
            <h1 class="title" id="title"></h1>
            <p class="hero-sub" id="heroSub"></p>
            <p class="hero-byline" id="heroByline"></p>
        </div>
    </header>
    <nav class="tabbar">
        <div class="wrap tabber-inner">
            <div class="tabs" id="tabButtons" role="tablist"></div>
            <div class="lang-toggle" id="langToggle"></div>
        </div>
    </nav>

    <main class="wrap">
        <section id="guide" role="tabpanel">
            <div class="directory">
                <label class="search-box">
                  <svg width="18" height="18" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor"/><line x1="11" y1="11" x2="15" y2="15" stroke="currentColor"/></svg>  
                  <input type="text" id="searchInput" aria-label="search situations">
                </label>
                <div id="chipRow" role="group" aria-label="Filter by care setting"></div>
                <span class="result-count" id="resultCount"></span>
            </div>

            <p class="section-note" id="section1Note"></p>
            <div class ='grid' id="cardGrid"></div>
            <p class="empty-state" id="emptyState" hidden></p>
        </section>

    <section id="support" role="tabpanel"hidden>
        <p class="section-note" id="section2Note"></p>
        <div class="suport-grid" id="supportGrid"></div>
    </section>

    <section class="story-section" id="story" role="tabpanel" hidden>
            <p class="story-intro" id="storyIntro"></p>
            <div class="timeline" id="storyTimeline"></div>
        </div>
    </section>
    </main>

    <footer class="wrap">
        <p id="footerText"></p>
    </footer>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
